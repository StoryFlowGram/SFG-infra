name: sfg-platform-local

services:

  nginx:
    image: nginx:alpine
    container_name: sfg-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx-local.conf:/etc/nginx/nginx.conf
    networks:
      - sfg-network
    depends_on:
      - gateway
      - frontend
    restart: always

  gateway:
    build: 
      context: ../Backend/api-gateway
      dockerfile: Dockerfile
    container_name: sfg-gateway
    env_file: .env.local
    environment:
      - JWT_SECRET_KEY=${GLOBAL_JWT_SECRET}
    networks:
      - sfg-network
    depends_on:
      - identity-service
      - book-service
    restart: always

  frontend:
    build: 
      context: ../Frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    container_name: sfg-frontend
    env_file: .env.local
    networks:
      - sfg-network
    restart: always

  bot-service:
    build:
      context: ../bot-service
      dockerfile: Dockerfile
    container_name: sfg-bot-service
    env_file: .env.local
    networks:
      - sfg-network
    restart: always

  identity-service:
    build:
      context: ../Backend/identity-service
      dockerfile: Dockerfile
    container_name: sfg-identity-service
    env_file: .env.local
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sfg-network
    restart: always

  book-service:
    build:
      context: ../Backend/book-service
      dockerfile: Dockerfile
    container_name: sfg-book-service
    env_file: .env.local
    environment:
      - TASKIQ_BROKER_URL=${TASKIQ_BROKER_URL}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - S3_REGION_NAME=${S3_REGION_NAME}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
    depends_on:
      db:
        condition: service_healthy
      book-redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8001:8000"
    networks:
      - sfg-network
    restart: always

  book-worker:  
    build:
      context: ../Backend/book-service
      dockerfile: Dockerfile
    container_name: sfg-book-worker
    command: taskiq worker app.infrastructure.taskiq.broker:broker
    env_file: .env.local
    environment:
      - TASKIQ_BROKER_URL=${TASKIQ_BROKER_URL}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - S3_REGION_NAME=${S3_REGION_NAME}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
    depends_on:
      book-redis:
        condition: service_healthy
      db: 
        condition: service_healthy
    networks:
      - sfg-network
    restart: always

  learning-service:
    build:
      context: ../Backend/learning-service
      dockerfile: Dockerfile
    container_name: sfg-learning-service
    env_file: .env.local
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sfg-network
    restart: always

  reader-service:
    build:
      context: ../Backend/reader-service
      dockerfile: Dockerfile
    container_name: sfg-reader-service
    env_file: .env.local
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sfg-network
    restart: always

  translation-service:
    build:
      context: ../Backend/translation-service
      dockerfile: Dockerfile
    container_name: sfg-translation-service
    env_file: .env.local
    networks:
      - sfg-network
    restart: always

  # DATABASES & INFRA
  db:  
    image: postgres:15
    container_name: sfg-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: postgres
      IDENTITY_DB_USER: ${IDENTITY_DB_USER:-identity_user}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_password}
      IDENTITY_DB_NAME: ${IDENTITY_DB_NAME:-identity-db}
      BOOK_DB_USER: ${BOOK_DB_USER:-book_user}
      BOOK_DB_PASSWORD: ${BOOK_DB_PASSWORD:-book_password}
      BOOK_DB_NAME: ${BOOK_DB_NAME:-book-db}
      LEARN_DB_USER: ${LEARN_DB_USER:-learn_user}
      LEARN_DB_PASSWORD: ${LEARN_DB_PASSWORD:-learn_password}
      LEARN_DB_NAME: ${LEARN_DB_NAME:-learn-db}
      READER_DB_USER: ${READER_DB_USER:-reader_user}
      READER_DB_PASSWORD: ${READER_DB_PASSWORD:-reader_password}
      READER_DB_NAME: ${READER_DB_NAME:-reader-db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - sfg-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  book-redis:
    image: redis:7-alpine
    container_name: sfg-book-redis
    networks:
      - sfg-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always

  minio:
    image: minio/minio
    container_name: sfg-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-sfg_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minio_password}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - sfg-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: always

volumes:
  postgres_data:
  minio_data:
  certbot_conf:

networks:
  sfg-network:
    driver: bridge